<!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Backend Demo</title>
    </head>
    <style>
        table {
            border-collapse: collapse;
            width: 100%;
        }
        
        th, td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
        }
        
        th {
            background-color: transparent;
            font-weight: bold;
        }
        
        tr {
            background-color: transparent;
            color: white;
        }

        tr:hover {
            background-color: #f5f5f5;
        }
        
        .usage-low {
            color: green;
        }
        
        .usage-middle {
            color: orange;
        }
        
        .usage-high {
            color: red;
            font-weight: bold;
        }
    </style>
    <body>
        <h1>PRIS-718服务器</h1>
        <button id="callBackendBtn">查询</button>
        <div id="result" style="margin-top: 20px; padding: 10px; border: 1px solid #ccc;">
            <div class="no-data">点击查询按钮获取服务器数据</div>
        </div>
        <!-- 表格容器 -->
        <div id="table-container" style="display: none;"></div>

        <script>
            // 与插件通信的API
            const vscode = acquireVsCodeApi();
            // 获取DOM元素
            const btn = document.getElementById('callBackendBtn');
            const resultDiv = document.getElementById('result');
            // 按钮点击事件
            btn?.addEventListener('click', () => {
                // 状态更新：加载中
                btn.disabled = true;
                resultDiv.innerHTML = '<div class="loading">正在查询服务器数据...</div>';
                // 发送消息给插件（后端）
                vscode.postMessage({
                    command: 'getGpuList'
                });
            });
            // 接收来自插件的消息
            window.addEventListener('message', event => {
                const message = event.data;
                renderGpuTable(message);
                btn.disabled = false;
            });

            // 处理原始数据：扁平化结构（关联服务器IP和GPU信息）
            function formatGpuData(rawData) {
                const formattedData = [];
                
                rawData.forEach(serverObj => {
                    const serverIp = Object.keys(serverObj)[0];
                    const gpuList = serverObj[serverIp];
                    
                    // 将所有GPU信息合并到一个条目中
                    const gpuInfo = gpuList.map(gpu => {
                        const usagePercent = ((gpu.usage / gpu.total) * 100).toFixed(1);
                        return {
                            gpuType: gpu.gpu_type,
                            totalMemory: gpu.total,
                            usedMemory: gpu.usage,
                            usagePercent: usagePercent
                        };
                    });
                    
                    formattedData.push({
                        serverIp: serverIp,
                        gpus: gpuInfo
                    });
                });
                
                return formattedData;
            }

            // 渲染表格
            function renderGpuTable(result) {
                const statusEl = document.getElementById("result");
                const tableContainer = document.getElementById("table-container");

                try {
                    // 处理原始数据
                    const formattedData = formatGpuData(result);
                    if (formattedData.length === 0) {
                        statusEl.textContent = "暂无GPU资源数据";
                        statusEl.className = "status";
                        return;
                    }

                    // 隐藏状态提示，显示表格
                    statusEl.style.display = "none";
                    tableContainer.style.display = "block";

                    // 生成表格HTML
                    const tableHtml = `
                        <table>
                            <thead>
                                <tr>
                                    <th>服务器IP</th>
                                    <th>GPU型号</th>
                                    <th>已用内存(MB)</th>
                                    <th>总内存(MB)</th>
                                    <th>内存使用率(%)</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${formattedData.map(server => {
                                    // 创建每个GPU的行
                                    const gpuRows = server.gpus.map((gpu, index) => {
                                        let usageClass = "usage-low";
                                        if (gpu.usagePercent >= 80) {
                                            usageClass = "usage-high";
                                        } else if (gpu.usagePercent >= 50) {
                                            usageClass = "usage-middle";
                                        }
                                        
                                        // 只在第一行显示服务器IP，并使用rowspan跨越所有GPU行
                                        const serverIpCell = index === 0 ? 
                                            `<td rowspan="${server.gpus.length}">${server.serverIp}</td>` : '';
                                        
                                        return `
                                            <tr>
                                                ${serverIpCell}
                                                <td>${gpu.gpuType}</td>
                                                <td>${gpu.usedMemory}</td>
                                                <td>${gpu.totalMemory}</td>
                                                <td class="${usageClass}">${gpu.usagePercent}%</td>
                                            </tr>
                                        `;
                                    }).join("");
                                    
                                    return gpuRows;
                                }).join("")}
                            </tbody>
                        </table>
                    `;

                    tableContainer.innerHTML = tableHtml;

                } catch (err) {
                    statusEl.textContent = `表格渲染失败：${err.message}`;
                    statusEl.className = "status error";
                }
            }
        </script>
    </body>
    </html>
